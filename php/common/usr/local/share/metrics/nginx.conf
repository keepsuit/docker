# Private metrics listener, installed by /etc/entrypoint.d/50-metrics.sh.
server {
    listen 8081;

    server_name _;
    access_log off;

    location = /_metrics/queue-size {
        include        fastcgi_params;
        fastcgi_param  SCRIPT_NAME     /_metrics/queue-size;
        fastcgi_param  SCRIPT_FILENAME /usr/local/share/metrics/queue-size.php;
        fastcgi_read_timeout 5s;
        fastcgi_pass   127.0.0.1:9000;
    }

    location / {
        return 404;
    }
}
